name: CaliforniaEats
options:
  bundleIdPrefix: com.californiaeats
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  CaliforniaEats:
    type: application
    platform: iOS
    sources:
      - path: CaliforniaEats
        excludes:
          - "Resources/Data"
      # the bundled data: index.json + one file per region, copied as a folder (Bundle.main.url(forResource: "Data", ...))
      - path: CaliforniaEats/Resources/Data
        type: folder
        buildPhase: resources
    info:
      path: CaliforniaEats/Info.plist
      properties:
        CFBundleDisplayName: CA Eats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Light      # the palette is light-only (Design/Theme.swift); Wisconsin's dark mode made lists unreadable
        NSLocationWhenInUseUsageDescription: "Your location sorts taquerías, dim sum and restaurants by distance and shows where you are on the map. It stays on your device."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.californiaeats.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [CaliforniaEatsTests, CaliforniaEatsUITests]

  CaliforniaEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaliforniaEatsTests
    dependencies:
      - target: CaliforniaEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.californiaeats.ios.tests
        GENERATE_INFOPLIST_FILE: true

  CaliforniaEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CaliforniaEatsUITests
    dependencies:
      - target: CaliforniaEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.californiaeats.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: CaliforniaEats
